<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <!-- Подключаем ретро-шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --retro-bg: #0a0a0a;
            --retro-green: #39ff14;
            --retro-red: #ff003c;
            --retro-yellow: #fde802;
            --retro-blue: #04d9ff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--retro-bg);
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            color: white;
            user-select: none;
        }

        /* Эффект старого телевизора (CRT) */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        /* Анимация мерцания экрана */
        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.02);
            opacity: 0;
            z-index: 50;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.01; }
            50% { opacity: 0.04; }
            100% { opacity: 0.01; }
        }

        /* Канвас со звездным небом (как в Contra) */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Контейнер с контентом */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 1rem;
        }

        /* Мигающий текст INSERT COIN */
        .blink {
            animation: blinker 1.2s step-start infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Эффект глитча для заголовка */
        .glitch {
            position: relative;
            color: var(--retro-red);
            font-size: 1.5rem;
            text-shadow: 2px 2px 0px #000;
        }
        @media (min-width: 768px) {
            .glitch { font-size: 3rem; }
        }

        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--retro-bg);
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 var(--retro-blue);
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 var(--retro-green);
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(20px, 9999px, 86px, 0); }
            10% { clip: rect(62px, 9999px, 14px, 0); }
            20% { clip: rect(4px, 9999px, 88px, 0); }
            30% { clip: rect(98px, 9999px, 25px, 0); }
            40% { clip: rect(10px, 9999px, 75px, 0); }
            50% { clip: rect(48px, 9999px, 34px, 0); }
            60% { clip: rect(82px, 9999px, 99px, 0); }
            70% { clip: rect(12px, 9999px, 51px, 0); }
            80% { clip: rect(74px, 9999px, 13px, 0); }
            90% { clip: rect(33px, 9999px, 89px, 0); }
            100% { clip: rect(90px, 9999px, 44px, 0); }
        }

        /* Пиксельный блок (Mario Style) на чистом CSS */
        .q-block {
            width: 64px;
            height: 64px;
            background-color: #ff9900;
            border: 4px solid #000;
            box-shadow: inset -4px -4px 0px 0px #cc6600, inset 4px 4px 0px 0px #ffcc66, 0 8px 0px rgba(0,0,0,0.5);
            position: relative;
            margin: 2rem auto;
            animation: bounce 2s infinite;
        }
        
        .q-block::before {
            content: "?";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffcc66;
            font-size: 36px;
            text-shadow: 4px 4px 0px #cc6600;
        }

        .q-block::after {
            content: "";
            position: absolute;
            top: 4px; left: 4px;
            width: 8px; height: 8px;
            background-color: #000;
            box-shadow: 40px 0 0 #000, 0 40px 0 #000, 40px 40px 0 #000;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Декоративные элементы интерфейса */
        .hud {
            position: absolute;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: white;
            z-index: 20;
        }

        @media (min-width: 768px) {
            .hud { font-size: 1rem; padding: 1rem 2rem; }
        }
    </style>
</head>
<body class="crt">

    <!-- Фоновый холст для звезд -->
    <canvas id="starfield"></canvas>

    <!-- Игровой HUD -->
    <div class="hud">
        <div>
            <p style="color: var(--retro-red);">1UP</p>
            <p>000000</p>
        </div>
        <div style="text-align: center;">
            <p style="color: var(--retro-yellow);">HIGH SCORE</p>
            <p>999999</p>
        </div>
        <div style="text-align: right;">
            <p style="color: var(--retro-blue);">STAGE</p>
            <p>1-1</p>
        </div>
    </div>

    <!-- Основной контент -->
    <div class="content w-full max-w-4xl mx-auto">
        
        <!-- Заголовок с глитчем -->
        <h1 class="glitch mb-8" data-text="САЙТ В РАЗРАБОТКЕ">САЙТ В РАЗРАБОТКЕ</h1>
        
        <!-- Анимированный пиксельный блок -->
        <div class="q-block"></div>

        <!-- Ретро-текст -->
        <div class="mt-8 space-y-6 text-xs md:text-base leading-loose text-white">
            <p class="text-[var(--retro-blue)]">ERROR 404: PRINCESS IS IN ANOTHER CASTLE</p>
            <p class="text-[var(--retro-yellow)]">BUILDING NEW LEVELS...</p>
        </div>

        <!-- Подсказка -->
        <div class="mt-16">
            <p class="blink text-[var(--retro-green)] text-sm md:text-xl">PRESS START TO CONTINUE</p>
        </div>
    </div>

    <script>
        // Инициализация звездного неба на Canvas
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function initStars() {
            stars = [];
            // Создаем 150 звезд разного размера и скорости
            for (let i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 3 + 0.5,
                    color: Math.random() > 0.8 ? '#fde802' : '#ffffff' // Иногда желтые звезды
                });
            }
        }

        function animate() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < stars.length; i++) {
                let star = stars[i];
                
                // Рисуем квадратную (пиксельную) звезду
                ctx.fillStyle = star.color;
                ctx.fillRect(star.x, star.y, star.size, star.size);

                // Движение вниз (эффект падения/полета вперед)
                star.y += star.speed;

                // Возврат звезды наверх, если она улетела за экран
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            }

            requestAnimationFrame(animate);
        }

        // Запуск
        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        resize();
        initStars();
        animate();
    </script>
</body>
</html>
